                var imageSrc = pos.color === "red" ? "https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png" : "https://t1.daumcdn.net/mapjsapi/images/marker.png";
                var marker = new kakao.maps.Marker({
                    map: map, position: latlng,
                    image: new kakao.maps.MarkerImage(imageSrc, new kakao.maps.Size(35, 50))
                });
                var content = `<div class="custom-info">
                    <span class="info-title">${pos.addr}</span>
                    <div class="info-item">- 정보 확인 기준일 : <span class="date-highlight">${pos.date}</span></div>
                    <div class="info-item">- 변전소 : ${pos.sub}</div>
                    <div class="info-item">- 주변압기 : ${pos.mtr}</div>
                    <div class="info-item">- 배전선로 : <span class="${pos.color === 'red' ? '' : 'highlight'}">${pos.dl}</span></div>
                    <div class="info-item">- 출력제어조건부 : ${pos.cond}</div>
                    <div class="info-item">- 송전계통보강일정 : ${pos.gosi}</div>
                </div>`;
                var infowindow = new kakao.maps.InfoWindow({ content: content, removable: true });
                kakao.maps.event.addListener(marker, 'click', function() { infowindow.open(map, marker); });
                bounds.extend(latlng);
            });
            if (positions.length > 0) map.setBounds(bounds);
        </script>
    </body>
    </html>
